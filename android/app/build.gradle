plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.rsvpn.app"
    compileSdk 34
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.rsvpn.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // TODO: استبدل بمفتاح التوقيع الخاص بك قبل النشر
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
    }

    // المكتبات الأصلية (AmneziaWG / WireGuard / tun2socks) تُنسخ هنا بعد
    // تصريفها حسب BUILD_STEPS.md — لا تُضمَّن جاهزة من أي مصدر آخر
    sourceSets {
        main.jniLibs.srcDirs += ['src/main/jniLibs']
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.13.1"
}
