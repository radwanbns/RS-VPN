name: Build RS VPN

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true # فعّلها بصرامة لاحقًا بعد إضافة اختبارات

  build-apk:
    name: Build APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # ⚠️ هذه الخطوة تفترض أنك جهّزت المكتبات الأصلية مسبقًا
      # (AmneziaWG / WireGuard) حسب BUILD_STEPS.md ووضعتها في:
      #   android/app/src/main/jniLibs/arm64-v8a/
      #   android/app/src/main/jniLibs/armeabi-v7a/
      # إن لم تكن موجودة بعد، هذا الـ step يتأكد فقط أن المجلدات موجودة
      # ولا يفشل البناء، لكن الـ APK الناتج لن يحتوي محرك اتصال فعلي.
      - name: Check native libs presence
        run: |
          echo "Checking for native AmneziaWG libraries..."
          find android/app/src/main/jniLibs -name "*.so" || echo "⚠️ لا توجد مكتبات .so بعد — راجع BUILD_STEPS.md"

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-vpn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
