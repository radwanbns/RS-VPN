name: Build RS VPN (Kotlin)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Lint & Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # يولّد gradlew + gradle-wrapper.jar تلقائيًا (غير مضمّنين في
      # المستودع لأنهما ملفات ثنائية) باستخدام إصدار Gradle المحدد في
      # gradle/wrapper/gradle-wrapper.properties
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lint

      # ⚠️ تفترض هذه الخطوة أنك جهّزت مكتبات AmneziaWG الأصلية مسبقًا
      # حسب BUILD_STEPS.md ووضعتها في app/src/main/jniLibs/. إن لم تكن
      # موجودة بعد، البناء ينجح لكن الـ APK بدون محرك اتصال فعلي.
      - name: Check native libs presence
        run: |
          echo "Checking for native AmneziaWG libraries..."
          find app/src/main/jniLibs -name "*.so" || echo "⚠️ لا توجد مكتبات .so بعد — راجع BUILD_STEPS.md"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
